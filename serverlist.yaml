# Servers the launcher offers in its server picker.
#
# The launcher downloads this file from the main branch of
# github.com/Dreadnought-Revival/Dreadnought-Revival-Launcher every time it
# starts (falling back to its last download, then to the copy built into it),
# so a change here reaches every player without a new launcher. To list a
# community server, open a pull request adding an entry.
#
#   id              stable key; never change it (sign-ins and settings use it)
#   name            what the picker shows
#   description     one line under the name (optional)
#   host            the server's DNS name (or IP); looked up again before every Play
#   web_port        TCP port of the HTTPS gateway: launcher sign-in and news (443 if omitted)
#   gateway_port    TCP port of the game's web services, -GatewayPort (65443 if omitted)
#   firmament_port  TCP port of the game's Firmament connection, -YFirmamentPort (48843 if omitted)
#   ca_cert         the server's CA certificate (its certs/ca.crt, PEM). Optional:
#                   with it, the launcher installs exactly this certificate and
#                   shows "from the official server list"; without it, it asks
#                   the server for its certificate and the player checks the
#                   fingerprint, as for a server added by hand. A server that
#                   regenerates its CA must update this entry.
#
# Battle-server (UDP) ports need no entry: the server tells the game each
# match's port.

servers:
  - id: revival
    name: Dreadnought Revival
    description: The project's own server (playtest)
    host: dread.monaxe.de
    web_port: 8443
    gateway_port: 65443
    firmament_port: 48843
