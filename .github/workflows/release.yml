name: Playtest release

# Every push to main (and a manual run) builds the launcher and publishes it as
# a release, so testers always find the newest build under Releases.
#
# One exe for everybody: the servers come from serverlist.yaml (built in, and
# downloaded again by the launcher at every start), each with its CA, so
# nothing about a server is built in and no secret is needed.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      # Launchers download the list at every start; editing it needs no build.
      - "serverlist.yaml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  GO_VERSION: "1.25.x"
  GOWORK: "off"

jobs:
  test:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 ./...

  release:
    name: Build and release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -H windowsgui" -o dist/dn-launcher.exe .
          # Linux bundle: the same exe run inside the game's Wine/Proton prefix.
          b=dreadnought-launcher-linux
          mkdir -p "dist/$b"
          cp dist/dn-launcher.exe linux/dn-launcher-linux.sh linux/README.txt "dist/$b/"
          cp winres/icon.png "dist/$b/icon.png"
          chmod +x "dist/$b/dn-launcher-linux.sh"
          tar -C dist -czf "dist/$b.tar.gz" "$b"
          rm -r "dist/$b"
          (cd dist && sha256sum -- dn-launcher.exe "$b.tar.gz" > SHA256SUMS.txt)

      - name: Listed servers
        # The fingerprints the certificate screen will show, for the notes.
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet --user pyyaml
          python3 - <<'PY' > servers.md
          import subprocess, yaml
          doc = yaml.safe_load(open("serverlist.yaml"))
          for s in doc.get("servers") or []:
              fp = ""
              if s.get("ca_cert"):
                  fp = subprocess.run(["openssl", "x509", "-noout", "-fingerprint", "-sha256"],
                                      input=s["ca_cert"], capture_output=True, text=True, check=True).stdout.split("=", 1)[1].strip()
              print(f"- **{s.get('name') or s['host']}**: certificate `{fp}`" if fp else f"- **{s.get('name') or s['host']}**")
          PY

      - name: Release notes
        run: |
          set -euo pipefail
          short=$(git rev-parse --short HEAD)
          {
            echo "Playtest build #${GITHUB_RUN_NUMBER} from \`${short}\` ($(date -u +%Y-%m-%d))."
            echo
            echo "**Windows:** download \`dn-launcher.exe\` and run it. Pick a server (the first listed one is chosen for you),"
            echo "then install its certificate when asked; the fingerprint on that screen must match the one below."
            echo
            echo "**Linux (Steam/Proton or Wine):** download \`dreadnought-launcher-linux.tar.gz\`, unpack it and run \`./dn-launcher-linux.sh\` (see README.txt inside)."
            echo
            echo "### Servers in this build's list"
            echo "(The launcher downloads \`serverlist.yaml\` again at every start, so later list changes reach this build too.)"
            echo
            cat servers.md
            echo
            echo "### Changes"
            prev=$(git describe --tags --abbrev=0 --match 'playtest-*' 2>/dev/null || true)
            if [ -n "${prev}" ]; then
              git log --no-merges --format='- %s (%h)' "${prev}..HEAD"
            else
              git log --no-merges --format='- %s (%h)' -n 20
            fi
            echo
            echo "### SHA-256"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="playtest-${GITHUB_RUN_NUMBER}"
          gh release create "${tag}" dist/* \
            --target "${GITHUB_SHA}" \
            --title "Playtest build #${GITHUB_RUN_NUMBER}" \
            --notes-file notes.md \
            --latest
